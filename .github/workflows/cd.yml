name: CD

# Builds the 8 backend services for linux/amd64, matching the live AWS ECS
# x86_64 deployment. The frontend is excluded — it deploys to Vercel via its
# own pipeline.
#
# Optional AWS ECS deploy: set AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY repo
# secrets and pass deploy_aws=true to apply infra/aws/terraform.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (default: short git SHA)"
        required: false
      run_training:
        description: "Run a training job and log to MLflow"
        required: false
        default: "true"
      deploy_aws:
        description: "Apply Terraform and deploy ECS-on-EC2 in AWS"
        required: false
        default: "false"
      aws_region:
        description: "AWS region for Terraform deploy"
        required: false
        default: "us-east-1"
      ecs_cpu_architecture:
        description: "ECS CPU architecture: x86_64 or arm64"
        required: false
        default: "x86_64"
      ecs_instance_type:
        description: "ECS EC2 instance type"
        required: false
        default: "m7i-flex.large"
      ecs_desired_size:
        description: "ECS Auto Scaling Group desired capacity"
        required: false
        default: "3"
      ecs_max_size:
        description: "ECS Auto Scaling Group max capacity"
        required: false
        default: "4"
      frontend_origin:
        description: "Frontend origin for CORS. Use * for an open demo."
        required: false
        default: "*"
      deploy_ec2:
        description: "SSH to EC2 and roll the new images (needs EC2_* secrets)"
        required: false
        default: "false"
  push:
    branches: [main]
    paths:
      - "moe-ids/**"
      - "dashboard/**"
      - ".github/workflows/cd.yml"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - "infra/aws/**"

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_TAG: ${{ github.event.inputs.tag || github.sha }}
  PLATFORM: linux/amd64
  REGISTRY: ghcr.io

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Build backend images and push to ghcr.io
  # (frontend is excluded — Vercel handles it)
  # ──────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build amd64 · ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: moe-inference
            context: ./moe-ids
            dockerfile: services/inference/Dockerfile
          - image: moe-training
            context: ./moe-ids
            dockerfile: services/training/Dockerfile
          - image: moe-monitoring
            context: ./moe-ids
            dockerfile: services/monitoring/Dockerfile
          - image: moe-grafana
            context: ./moe-ids
            dockerfile: monitoring/grafana/Dockerfile
          - image: dashboard-gateway
            context: ./dashboard/gateway
            dockerfile: Dockerfile
          - image: dashboard-auth
            context: ./dashboard/auth
            dockerfile: Dockerfile
          - image: dashboard-inference
            context: ./dashboard/inference
            dockerfile: Dockerfile
          - image: dashboard-upload
            context: ./dashboard/upload
            dockerfile: Dockerfile
          - image: dashboard-report
            context: ./dashboard/report
            dockerfile: Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Lowercase repo owner
        id: repo
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.image }} (${{ env.PLATFORM }})
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          platforms: ${{ env.PLATFORM }}
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.owner }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.owner }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  # ──────────────────────────────────────────────────────────────────────
  # Train + log to MLflow (so the registry has a fresh run aligned with
  # the deployed image tag). Runs in parallel with build-and-push.
  # ──────────────────────────────────────────────────────────────────────
  train-and-log:
    name: Train + log to MLflow
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_training != 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moe-ids
    services:
      mlflow_db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: mlflow
          POSTGRES_PASSWORD: mlflow
          POSTGRES_DB: mlflow
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U mlflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: moe-ids/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api,mlflow]"
          pip install mlflow psycopg2-binary

      - name: Verify cleaned datasets
        run: |
          test -f ../MoE/Global_CLEANED.csv || (echo "::error::Global_CLEANED.csv missing" && exit 1)
          test -f ../MoE/AIoT_6G_CLEANED.csv || (echo "::error::AIoT_6G_CLEANED.csv missing" && exit 1)

      - name: Start MLflow server
        run: |
          nohup mlflow server \
            --backend-store-uri postgresql://mlflow:mlflow@localhost:5433/mlflow \
            --default-artifact-root /tmp/mlruns \
            --host 0.0.0.0 --port 5000 > /tmp/mlflow.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://localhost:5000/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:5000/health

      - name: Train and log to MLflow
        env:
          MLFLOW_TRACKING_URI: http://localhost:5000
          PYTHONUTF8: "1"
        run: |
          python scripts/train.py \
            --data-5g ../MoE/Global_CLEANED.csv \
            --data-6g ../MoE/AIoT_6G_CLEANED.csv \
            --artefacts-dir artefacts/cd \
            --seed 42 \
            --ae-epochs 5 \
            --gate-epochs 5 \
            --xgb-n-estimators 100 \
            --mlflow-tracking-uri http://localhost:5000 \
            --experiment unified_moe_cd \
            --no-pushgateway

      - name: Upload trained artefacts
        uses: actions/upload-artifact@v4
        with:
          name: artefacts-cd-${{ env.IMAGE_TAG }}
          path: moe-ids/artefacts/cd/
          retention-days: 30

      - name: Auto-promote to Production on F1 threshold
        env:
          MLFLOW_TRACKING_URI: http://localhost:5000
        run: |
          python scripts/promote.py \
            --latest \
            --to production \
            --experiment unified_moe_cd \
            --mlflow-tracking-uri http://localhost:5000 \
          || echo "::warning::Auto-promotion skipped (thresholds not met or registry unavailable)"

      - name: Dump MLflow log on failure
        if: failure()
        run: tail -200 /tmp/mlflow.log || true

  # ──────────────────────────────────────────────────────────────────────
  # Trivy security scan on the just-pushed ghcr images
  # ──────────────────────────────────────────────────────────────────────
  security-scan:
    name: Trivy · ${{ matrix.image }}
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - moe-inference
          - moe-training
          - moe-monitoring
          - moe-grafana
          - dashboard-gateway
          - dashboard-auth
          - dashboard-inference
          - dashboard-upload
          - dashboard-report
    steps:
      - name: Lowercase repo owner
        id: repo
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.repo.outputs.owner }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}
        continue-on-error: true

  # ──────────────────────────────────────────────────────────────────────
  # Optional: deploy the ECS-on-EC2 Terraform stack on AWS.
  # Requires repo secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY.
  # Optional secrets: AWS_SESSION_TOKEN, VERCEL_FRONTEND_ORIGIN.
  # ──────────────────────────────────────────────────────────────────────
  deploy-aws-ecs:
    name: Deploy AWS ECS
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.deploy_aws == 'true' &&
      needs.build-and-push.result == 'success' &&
      (needs.train-and-log.result == 'success' || needs.train-and-log.result == 'skipped')
    needs: [build-and-push, train-and-log]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TF_IN_AUTOMATION: "true"
      AWS_REGION: ${{ github.event.inputs.aws_region || 'us-east-1' }}
      ECS_CPU_ARCHITECTURE: ${{ github.event.inputs.ecs_cpu_architecture || 'x86_64' }}
      ECS_INSTANCE_TYPE: ${{ github.event.inputs.ecs_instance_type || 'm7i-flex.large' }}
      ECS_DESIRED_SIZE: ${{ github.event.inputs.ecs_desired_size || '3' }}
      ECS_MAX_SIZE: ${{ github.event.inputs.ecs_max_size || '4' }}
      FRONTEND_ORIGIN: ${{ github.event.inputs.frontend_origin || secrets.VERCEL_FRONTEND_ORIGIN || '*' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Lowercase repo owner
        id: repo
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Write CI Terraform variables
        working-directory: infra/aws/terraform
        run: |
          cat > ci.auto.tfvars <<EOF
          project_name = "verado-demo"
          aws_region   = "${AWS_REGION}"

          github_owner = "${{ steps.repo.outputs.owner }}"
          image_tag    = "${IMAGE_TAG}"

          frontend_origin    = "${FRONTEND_ORIGIN}"
          acm_certificate_arn = ""

          ecs_cpu_architecture = "${ECS_CPU_ARCHITECTURE}"
          ecs_instance_type    = "${ECS_INSTANCE_TYPE}"
          ecs_min_size         = 0
          ecs_desired_size     = ${ECS_DESIRED_SIZE}
          ecs_max_size         = ${ECS_MAX_SIZE}

          service_desired_counts = {
            "api-gateway"        = 1
            "auth-svc"           = 1
            "upload-svc"         = 1
            "inference-svc"      = 1
            "report-svc"         = 1
            "moe-inference-svc"  = 1
            "moe-monitoring-svc" = 1
            "redis"              = 1
            "minio"              = 1
            "moe-training-svc"   = 1
            "mlflow"             = 1
            "prometheus"         = 1
            "grafana"            = 1
            "pushgateway"        = 1
          }
          EOF

      - name: Terraform apply
        working-directory: infra/aws/terraform
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve

      - name: Download trained artefacts
        if: github.event.inputs.run_training != 'false'
        uses: actions/download-artifact@v4
        with:
          name: artefacts-cd-${{ env.IMAGE_TAG }}
          path: /tmp/verado-artefacts/production

      - name: Upload demo assets to S3
        working-directory: infra/aws/terraform
        run: |
          BUCKET="$(terraform output -raw asset_bucket)"

          if [ -d /tmp/verado-artefacts/production ]; then
            aws s3 sync /tmp/verado-artefacts/production/ "s3://${BUCKET}/artefacts/production/" --delete
          elif [ -d ../../../moe-ids/artefacts/production ]; then
            aws s3 sync ../../../moe-ids/artefacts/production/ "s3://${BUCKET}/artefacts/production/" --delete
          else
            echo "::warning::No production artefacts found to upload."
          fi

          aws s3 cp ../../../MoE/Global_CLEANED.csv "s3://${BUCKET}/data/Global_CLEANED.csv"
          aws s3 cp ../../../MoE/AIoT_6G_CLEANED.csv "s3://${BUCKET}/data/AIoT_6G_CLEANED.csv"

      - name: Run one-off ECS setup tasks
        working-directory: infra/aws/terraform
        run: |
          CLUSTER="$(terraform output -raw ecs_cluster_name)"

          run_and_wait() {
            local task_definition="$1"
            local name="$2"
            local task_arn

            task_arn="$(aws ecs run-task \
              --cluster "$CLUSTER" \
              --launch-type EC2 \
              --task-definition "$task_definition" \
              --count 1 \
              --started-by "github-actions-${name}" \
              --query 'tasks[0].taskArn' \
              --output text)"

            if [ "$task_arn" = "None" ] || [ -z "$task_arn" ]; then
              echo "::error::Failed to start ${name} task"
              exit 1
            fi

            aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task_arn"
            exit_code="$(aws ecs describe-tasks \
              --cluster "$CLUSTER" \
              --tasks "$task_arn" \
              --query 'tasks[0].containers[0].exitCode' \
              --output text)"

            if [ "$exit_code" != "0" ]; then
              echo "::error::${name} task exited with ${exit_code}"
              exit 1
            fi
          }

          run_and_wait "$(terraform output -raw db_init_task_definition)" "db-init"
          run_and_wait "$(terraform output -raw asset_sync_task_definition)" "asset-sync"

      - name: Check API health
        working-directory: infra/aws/terraform
        run: |
          API_URL="$(terraform output -raw api_base_url)"
          for i in {1..60}; do
            if curl -fsS "${API_URL}/health"; then
              echo ""
              echo "API is healthy at ${API_URL}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::API health check failed at ${API_URL}/health"
          exit 1

  # ──────────────────────────────────────────────────────────────────────
  # Optional: SSH to the EC2 instance and roll the new images
  # Requires repo secrets: EC2_HOST, EC2_USER (default: ubuntu), EC2_SSH_KEY
  # ──────────────────────────────────────────────────────────────────────
  deploy-ec2:
    name: Deploy to EC2
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_ec2 == 'true'
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repo owner
        id: repo
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Verify deploy secrets are present
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ] || [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "::error::EC2_HOST and EC2_SSH_KEY secrets are required for deploy_ec2=true"
            exit 1
          fi

      - name: Write SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          # Strip Windows CR characters that sneak in when a .pem is pasted
          # from a Windows editor into a GitHub secret. SSH rejects keys with
          # CR in them as malformed. Then ensure exactly one trailing newline.
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          # Diagnostics (safe — doesn't leak the key body)
          echo "----- key shape -----"
          echo "first line : $(head -1 ~/.ssh/ec2_key)"
          echo "last line  : $(tail -1 ~/.ssh/ec2_key)"
          echo "line count : $(wc -l < ~/.ssh/ec2_key)"
          echo "byte count : $(wc -c < ~/.ssh/ec2_key)"
          echo "---------------------"

          # Validate
          if ! ssh-keygen -y -f ~/.ssh/ec2_key > /dev/null 2> /tmp/ssh-err; then
            echo "::error::EC2_SSH_KEY secret is malformed."
            echo "Reason:" && cat /tmp/ssh-err
            echo ""
            echo "Fixes to try, in order:"
            echo "  1. Open seif-ssh.pem in VS Code (NOT Notepad)."
            echo "  2. Select all (Ctrl+A) — including the -----BEGIN/END----- lines."
            echo "  3. Delete the existing EC2_SSH_KEY secret on GitHub, then re-add it."
            echo "  4. Paste — VS Code preserves Unix line endings."
            exit 1
          fi
          echo "✓ Key parses cleanly."

          # Best-effort host-key prefetch. If the runner can't reach port 22
          # (or ssh-keyscan exits non-zero for any reason) we continue — the
          # ssh/scp commands below pass -o StrictHostKeyChecking=accept-new,
          # so they'll TOFU-accept on first connect.
          ssh-keyscan -T 5 -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "Host-keys collected: $(wc -l < ~/.ssh/known_hosts) line(s)"

          # Connectivity diagnostics — pinpoint where the failure actually is.
          HOST="${{ secrets.EC2_HOST }}"
          echo ""
          echo "----- connectivity to $HOST -----"
          echo "▸ DNS resolution:"
          getent hosts "$HOST" || echo "  (could not resolve)"
          echo ""
          echo "▸ TCP port 22 reachable? (timeout 10s)"
          if timeout 10 bash -c "</dev/tcp/$HOST/22" 2>/dev/null; then
            echo "  ✓ TCP handshake OK — port 22 is open to this runner"
          else
            echo "  ✗ TCP handshake FAILED — security group / NACL blocking"
            echo ""
            echo "  Fix: AWS Console → EC2 → Security Groups → SG attached to your"
            echo "  instance → inbound rule port 22, source 0.0.0.0/0 → Save."
            echo "  Verify the SG is the one ACTUALLY attached to your instance"
            echo "  (Instances → click instance → Security tab)."
          fi
          echo ""
          echo "▸ SSH banner exchange? (timeout 10s)"
          if BANNER=$(timeout 10 bash -c "exec 3<>/dev/tcp/$HOST/22 && head -1 <&3" 2>/dev/null); then
            echo "  ✓ Banner: $BANNER"
          else
            echo "  ✗ TCP opened but no banner — likely NACL, fail2ban, or sshd not responding"
            echo "    • NACLs are stateless: ensure subnet NACL allows OUTBOUND"
            echo "      tcp 1024-65535 to 0.0.0.0/0 (for SSH responses)"
            echo "    • Check /var/log/secure on the instance for fail2ban bans"
            echo "    • SSH from your laptop to confirm sshd is alive right now"
          fi
          echo "----------------------------------"

      - name: Prepare deploy bundle
        run: |
          mkdir -p deploy-bundle/moe-ids/monitoring deploy-bundle/MoE
          cp docker-compose.yml docker-compose.prod.yml deploy-bundle/
          cp -r moe-ids/monitoring/. deploy-bundle/moe-ids/monitoring/
          # Training data — required by the moe-training-svc bind mount.
          # Skip silently if not present (e.g. LFS not pulled in CI).
          if [ -f MoE/Global_CLEANED.csv ];  then cp MoE/Global_CLEANED.csv  deploy-bundle/MoE/; fi
          if [ -f MoE/AIoT_6G_CLEANED.csv ]; then cp MoE/AIoT_6G_CLEANED.csv deploy-bundle/MoE/; fi
          ls -lR deploy-bundle | head -40

      - name: Copy deploy bundle to EC2
        env:
          DEPLOY_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          DEPLOY_HOST: ${{ secrets.EC2_HOST }}
        run: |
          SSH_OPTS="-i ~/.ssh/ec2_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          # Clean up any bogus directories Docker auto-created on a previous
          # failed run (when a bind-mount source didn't exist, Docker made it
          # a directory — that breaks the "file → file" mount on the next try).
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
            "rm -rf ~/verado/moe-ids/monitoring/prometheus.yml \
                    ~/verado/moe-ids/monitoring/grafana/provisioning \
                    ~/verado/moe-ids/monitoring/grafana/dashboards 2>/dev/null || true
             mkdir -p ~/verado/moe-ids/artefacts ~/verado/MoE ~/verado/moe-ids/monitoring"
          # Sync everything (-r recursive). Trailing /. on src means "contents of".
          scp $SSH_OPTS -r deploy-bundle/. \
            "$DEPLOY_USER@$DEPLOY_HOST:~/verado/"

      - name: Roll new images on EC2
        env:
          GHCR_USER: ${{ steps.repo.outputs.owner }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          DEPLOY_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          DEPLOY_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -e
             cd ~/verado
             echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
             export GHCR_OWNER='$GHCR_USER'
             export IMAGE_TAG='$IMAGE_TAG'
             docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
             docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
             docker image prune -f
             docker compose ps"

  # ──────────────────────────────────────────────────────────────────────
  # Slack notification (no-ops without SLACK_WEBHOOK_URL)
  # ──────────────────────────────────────────────────────────────────────
  notify:
    name: Slack notify
    if: always()
    needs: [build-and-push, security-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Compute overall status
        id: status
        run: |
          if [[ "${{ needs.build-and-push.result }}" == "failure" ]]; then
            echo "color=danger" >> "$GITHUB_OUTPUT"
            echo "emoji=:x:" >> "$GITHUB_OUTPUT"
            echo "text=CD failed" >> "$GITHUB_OUTPUT"
          else
            echo "color=good" >> "$GITHUB_OUTPUT"
            echo "emoji=:white_check_mark:" >> "$GITHUB_OUTPUT"
            echo "text=CD succeeded" >> "$GITHUB_OUTPUT"
          fi

      - name: Post to Slack
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "$(cat <<EOF
          {
            "attachments": [{
              "color": "${{ steps.status.outputs.color }}",
              "title": "${{ steps.status.outputs.emoji }} ${{ steps.status.outputs.text }} · ${{ env.PLATFORM }} · ghcr.io",
              "fields": [
                {"title": "Tag",        "value": "${{ env.IMAGE_TAG }}", "short": true},
                {"title": "Branch",     "value": "${{ github.ref_name }}", "short": true},
                {"title": "Build/push", "value": "${{ needs.build-and-push.result }}", "short": true},
                {"title": "Trivy scan", "value": "${{ needs.security-scan.result }}", "short": true}
              ],
              "footer": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }]
          }
          EOF
