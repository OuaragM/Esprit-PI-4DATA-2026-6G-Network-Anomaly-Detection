# ─────────────────────────────────────────────────────────────────────────────
# Production overlay — pulls pre-built linux/arm64 images from GitHub Container
# Registry (ghcr.io). Frontend is intentionally excluded: it deploys to Vercel.
#
# Usage on the EC2 host (Graviton/arm64):
#   echo $GHCR_PAT | docker login ghcr.io -u <github-user> --password-stdin
#   export GHCR_OWNER=<lowercase-github-owner>
#   export IMAGE_TAG=latest                  # or a specific git SHA
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  api-gateway:
    image: ghcr.io/${GHCR_OWNER}/dashboard-gateway:${IMAGE_TAG:-latest}
    build: !reset null

  # frontend-svc is deployed to Vercel separately — do not run from here.
  # Compose 'profiles' keeps the entry inert unless someone explicitly opts in.
  frontend-svc:
    profiles: ["never"]
    build: !reset null

  auth-svc:
    image: ghcr.io/${GHCR_OWNER}/dashboard-auth:${IMAGE_TAG:-latest}
    build: !reset null

  upload-svc:
    image: ghcr.io/${GHCR_OWNER}/dashboard-upload:${IMAGE_TAG:-latest}
    build: !reset null

  celery-worker:
    # Reuses the upload image with a different command. If the worker grows
    # its own deliverable, add a dashboard-celery-worker matrix entry to cd.yml.
    image: ghcr.io/${GHCR_OWNER}/dashboard-upload:${IMAGE_TAG:-latest}
    build: !reset null
    command: ["celery", "-A", "app.tasks", "worker", "--loglevel=info"]

  inference-svc:
    image: ghcr.io/${GHCR_OWNER}/dashboard-inference:${IMAGE_TAG:-latest}
    build: !reset null

  report-svc:
    image: ghcr.io/${GHCR_OWNER}/dashboard-report:${IMAGE_TAG:-latest}
    build: !reset null

  moe-inference-svc:
    image: ghcr.io/${GHCR_OWNER}/moe-inference:${IMAGE_TAG:-latest}
    build: !reset null

  moe-training-svc:
    image: ghcr.io/${GHCR_OWNER}/moe-training:${IMAGE_TAG:-latest}
    build: !reset null

  moe-monitoring-svc:
    image: ghcr.io/${GHCR_OWNER}/moe-monitoring:${IMAGE_TAG:-latest}
    build: !reset null
